name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Скачивает 40 русских шрифтов (Fontsource) внутрь приложения, чтобы работали без интернета
      - name: Fetch fonts
        continue-on-error: true
        run: node scripts/fetch-fonts.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Rin-pochta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rin-pochta-apk
          path: Rin-pochta.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rin-pochta build ${{ github.run_number }}
          body: Установочный файл Rin-pochta.apk (Android 7.0+). Скачайте и установите.
          files: Rin-pochta.apk
          make_latest: true
