plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.rin.pochta'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.rin.pochta'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    signingConfigs {
        release {
            storeFile rootProject.file('rin-pochta.jks')
            storePassword 'rinpochta'
            keyAlias 'rin'
            keyPassword 'rinpochta'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
